<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e4bd61" />
    <title>Hors ligne — Sama Naffa</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #f8faf9;
        color: #01081b;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      .brand {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e4bd61;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.875rem;
        line-height: 1.2;
      }
      p {
        margin: 1rem 0 0;
        font-size: 1rem;
        line-height: 1.5;
        color: #475569;
      }
      a.button {
        display: inline-block;
        margin-top: 2.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background: #435933;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover {
        background: #36482a;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Sama Naffa</p>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Impossible de charger cette page sans connexion. Vérifiez votre réseau,
        puis réessayez.
      </p>
      <a class="button" href="/">Réessayer</a>
    </main>
  </body>
</html>
