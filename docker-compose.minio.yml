# Local MinIO for KYC / Didit asset development.
# Start: docker compose -f docker-compose.minio.yml up -d
# Console: http://127.0.0.1:9001 (minioadmin / minioadmin)
# API: http://127.0.0.1:9000

services:
  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-05-24T17-08-30Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do sleep 1; done;
      mc mb --ignore-existing local/samanaffa-didit-assets;
      mc mb --ignore-existing local/samanaffa-kyc;
      echo 'Buckets ready';
      "

volumes:
  minio_data:
